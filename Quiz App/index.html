<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <div class="start-content">
                <h1>🎯 Quiz Master</h1>
                <p>Test your knowledge with our exciting quiz!</p>
                <button id="startBtn" class="btn btn-primary">Start Quiz</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-container">
                <!-- Progress Bar -->
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>

                <!-- Question Info -->
                <div class="quiz-info">
                    <span id="questionNumber">Question 1 of 10</span>
                    <span id="score">Score: 0</span>
                </div>

                <!-- Question -->
                <div class="question-container">
                    <h2 id="question">Question here?</h2>
                </div>

                <!-- Options -->
                <div class="options-container">
                    <div class="option" data-option="0">
                        <input type="radio" name="answer" id="option0" value="0">
                        <label for="option0" id="optionText0">Option 1</label>
                    </div>
                    <div class="option" data-option="1">
                        <input type="radio" name="answer" id="option1" value="1">
                        <label for="option1" id="optionText1">Option 2</label>
                    </div>
                    <div class="option" data-option="2">
                        <input type="radio" name="answer" id="option2" value="2">
                        <label for="option2" id="optionText2">Option 3</label>
                    </div>
                    <div class="option" data-option="3">
                        <input type="radio" name="answer" id="option3" value="3">
                        <label for="option3" id="optionText3">Option 4</label>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="button-group">
                    <button id="prevBtn" class="btn btn-secondary" disabled>← Previous</button>
                    <button id="nextBtn" class="btn btn-primary">Next →</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultScreen" class="screen">
            <div class="result-content">
                <div class="result-circle">
                    <h1 id="finalScore">0%</h1>
                </div>
                <h2 id="resultMessage">Great Job!</h2>
                <p id="resultDescription">You scored well on this quiz.</p>

                <div class="result-stats">
                    <div class="stat">
                        <span class="stat-label">Correct Answers</span>
                        <span id="correctCount" class="stat-value">0/10</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Accuracy</span>
                        <span id="accuracy" class="stat-value">0%</span>
                    </div>
                </div>

                <div class="result-review">
                    <h3>Review Your Answers</h3>
                    <div id="reviewContainer"></div>
                </div>

                <button id="restartBtn" class="btn btn-primary">Retake Quiz</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
